<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Safe success rates for the four benchmark methods</title>
<desc id="desc">Bar chart for 50 scenes: geometric oracle 96 percent, Gemini open-loop 50 percent, Gemini geometric shield 74 percent, Gemini local recovery 96 percent.</desc>
<rect width="1100" height="570" rx="24" fill="#ffffff"/>
<text x="62" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Safe task completion</text>
<text x="62" y="88" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Reported benchmark results · 50 scenes per method · success requires task completion and zero obstacle violations</text>
<g stroke="#e2e8f0" stroke-width="1">
  <line x1="125" y1="390" x2="1015" y2="390"/><line x1="125" y1="330" x2="1015" y2="330"/>
  <line x1="125" y1="270" x2="1015" y2="270"/><line x1="125" y1="210" x2="1015" y2="210"/>
  <line x1="125" y1="150" x2="1015" y2="150"/>
</g>
<g font-family="Arial,sans-serif" font-size="13" fill="#64748b" text-anchor="end">
  <text x="108" y="395">0%</text><text x="108" y="335">25%</text><text x="108" y="275">50%</text><text x="108" y="215">75%</text><text x="108" y="155">100%</text>
</g>
<line x1="125" y1="150" x2="125" y2="390" stroke="#94a3b8" stroke-width="2"/>
<line x1="125" y1="390" x2="1015" y2="390" stroke="#94a3b8" stroke-width="2"/>
<g>
  <rect x="190" y="159.6" width="125" height="230.4" rx="9" fill="#64748b"/>
  <rect x="405" y="270" width="125" height="120" rx="9" fill="#f97316"/>
  <rect x="620" y="212.4" width="125" height="177.6" rx="9" fill="#3b82f6"/>
  <rect x="835" y="159.6" width="125" height="230.4" rx="9" fill="#16a34a"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#0f172a">
  <text x="252" y="143" font-size="23" font-weight="700">96%</text><text x="252" y="414" font-size="14" font-weight="700">Oracle</text><text x="252" y="436" font-size="13" fill="#64748b">48 / 50</text>
  <text x="467" y="254" font-size="23" font-weight="700">50%</text><text x="467" y="414" font-size="14" font-weight="700">Open-loop</text><text x="467" y="436" font-size="13" fill="#64748b">25 / 50</text>
  <text x="682" y="196" font-size="23" font-weight="700">74%</text><text x="682" y="414" font-size="14" font-weight="700">Geometric shield</text><text x="682" y="436" font-size="13" fill="#64748b">37 / 50</text>
  <text x="897" y="143" font-size="23" font-weight="700">96%</text><text x="897" y="414" font-size="14" font-weight="700">Local recovery</text><text x="897" y="436" font-size="13" fill="#64748b">48 / 50</text>
</g>
<rect x="62" y="476" width="976" height="54" rx="12" fill="#f1f5f9"/>
<text x="550" y="499" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">All four methods completed the pick-and-place task in 50/50 scenes.</text>
<text x="550" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">The chart distinguishes task completion from safe completion.</text>
</svg>