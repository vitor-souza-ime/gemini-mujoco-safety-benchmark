<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">MuJoCo tabletop benchmark scene schematic</title>
<desc id="desc">Schematic overhead view of a Cartesian gantry tabletop with red, blue and yellow cubes, cyan, magenta and green target zones, and static and movable cylindrical obstacles.</desc>
<defs>
  <linearGradient id="table" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
</defs>
<rect width="1100" height="570" rx="24" fill="#f8fafc"/>
<text x="54" y="54" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">MuJoCo tabletop environment</text>
<text x="54" y="83" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Overhead schematic · Cartesian gantry · color-sorting pick-and-place task</text>
<rect x="55" y="112" width="990" height="390" rx="22" fill="url(#table)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<path d="M115 160 H985" stroke="#cbd5e1" stroke-width="13" stroke-linecap="round"/>
<path d="M550 145 V465" stroke="#94a3b8" stroke-width="11" stroke-linecap="round"/>
<rect x="518" y="190" width="64" height="48" rx="10" fill="#475569" stroke="#1e293b" stroke-width="2"/>
<path d="M550 238 V265" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
<path d="M535 265 H565" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
<text x="550" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">GANTRY RAIL</text>
<text x="550" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">tool carriage</text>
<text x="145" y="145" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334155">OBJECTS</text>
<text x="850" y="145" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334155">TARGET ZONES</text>
<g filter="url(#shadow)">
  <rect x="140" y="205" width="72" height="72" rx="12" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <rect x="140" y="315" width="72" height="72" rx="12" fill="#2563eb" stroke="#1e40af" stroke-width="3"/>
  <rect x="140" y="425" width="72" height="55" rx="12" fill="#eab308" stroke="#a16207" stroke-width="3"/>
</g>
<g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
  <text x="176" y="248">RED</text><text x="176" y="358">BLUE</text><text x="176" y="458" fill="#422006">YELLOW</text>
</g>
<g filter="url(#shadow)">
  <rect x="865" y="205" width="110" height="72" rx="12" fill="#06b6d4" stroke="#0e7490" stroke-width="3"/>
  <rect x="865" y="315" width="110" height="72" rx="12" fill="#d946ef" stroke="#a21caf" stroke-width="3"/>
  <rect x="865" y="425" width="110" height="55" rx="12" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
</g>
<g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
  <text x="920" y="248">CYAN</text><text x="920" y="358">MAGENTA</text><text x="920" y="458">GREEN</text>
</g>
<g fill="#8b5e3c" stroke="#5b3a25" stroke-width="3" filter="url(#shadow)">
  <circle cx="385" cy="250" r="37"/><circle cx="700" cy="390" r="37"/><circle cx="700" cy="225" r="40" stroke-dasharray="7 5"/>
</g>
<g font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
  <text x="385" y="254">STATIC</text><text x="700" y="394">STATIC</text><text x="700" y="229">MOVABLE</text>
</g>
<path d="M230 350 C380 350 445 310 525 310 S760 300 845 350" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
<text x="550" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">carrying route (illustrative)</text>
<rect x="55" y="520" width="990" height="34" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
<text x="550" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#9a3412">Conceptual schematic for documentation — not a screenshot or a scale-accurate rendering.</text>
</svg>